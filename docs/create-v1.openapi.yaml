openapi: 3.1.0
info:
  title: 12ui Create API
  version: 1.3.0
  description: >
    The /create pipeline tool. A CREATE run turns a concept plus at most 96
    single-reference candidates into gpt-image-2 (quality medium) interface
    designs. A BUILD run branches one approved design into a coherent screen
    set: one metered gpt-5.6-terra director call plans the site or app
    structure, and each planned screen is dispatched with worker-derived
    references. A run is claimed once with an Idempotency-Key, then each slot
    is dispatched; retries replay durable state and never repeat paid work,
    and a NEW Idempotency-Key on a settled slot buys exactly one further paid
    attempt. Anonymous callers use the public-preview identity headers with
    Turnstile action `12ui_create_image`; signed-in callers use the session.
    Daily image quotas: 12 public / 20 account (env-tunable).
paths:
  /api/v1/create:
    post:
      summary: Claim a create or build run and materialize its candidates
      description: >
        Two request shapes share this claim endpoint. A CREATE run (the
        default schema below) supplies 1-96 candidates. A BUILD run instead
        sends `{source: 'build', concept, winner | referenceImage, aspect?}`.
        The build claim performs one metered gpt-5.6-terra branch-plan call
        over the approved starting design (a succeeded candidate of an earlier
        run via `winner: {createRunId, slot}`, or an uploaded image) and
        materializes the planned screens as pending candidates in slots a-h.
        The plan decides a source page (continuations below the approved
        screen, or none when it already ends) plus 1-4 further pages or
        application routes of 1-2 screens each. The source page is ALWAYS
        plan position 0 — with `slots: []` and `sourceEndsHere: true` when the
        approved screen already ends — so a caller can always place that
        approved design. A plan larger than the available slots is trimmed
        deterministically from the trailing pages; `maxScreens` lowers that
        cap from the eight-slot ceiling, is asked of the director, and is
        enforced on parse. The cap shapes the plan and is NOT part of the run
        identity, so a replay under the same Idempotency-Key that adds or
        changes it replays the planned run rather than conflicting.
        Header, footer, and page-ending chrome are derived server-side from
        the surface type and each screen's position, never asked of the model.
        Build screens charge quota per dispatched slot rather than at claim.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateRunRequest'
                - $ref: '#/components/schemas/BuildRunRequest'
      responses:
        '201':
          description: Run claimed; envelope of pending candidates.
          headers:
            X-12ui-Funding: { $ref: '#/components/headers/FundingSource' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEnvelope' }
        '200':
          description: Idempotent replay of an existing run.
          headers:
            X-12ui-Funding: { $ref: '#/components/headers/FundingSource' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEnvelope' }
        '400': { description: Validation failure (unknown fields fail closed). }
        '409': { description: Idempotency-Key reused with a different request. }
        '402': { description: Free candidate allowance exhausted and prepaid wallet balance is insufficient. }
        '429': { description: Daily image quota or sponsored budget exhausted. }
        '502': { description: Branch planning failed after its bounded retry. }
  /api/v1/create/plan:
    post:
      summary: Prepare one durable hosted-redraw plan
      description: >
        Performs one gpt-5.6-terra low-reasoning structured-text request over
        the redraw direction and optional capture metadata. The provider
        schema is permissive; the Worker canonicalizes the three returned plan
        fields, records every recovery durably, and returns a structurally
        valid fallback without purchasing a repair call. The stable
        effectIdentity is derived from the authenticated principal and the
        Idempotency-Key. A replay returns the durable canonical JSON only after
        its stored output digest verifies.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostedPlanRequest' }
      responses:
        '201':
          description: A newly completed hosted plan.
          headers:
            X-12ui-Funding: { $ref: '#/components/headers/FundingSource' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostedPlanResponse' }
        '200':
          description: Idempotent replay of the durable canonical plan.
          headers:
            X-12ui-Funding: { $ref: '#/components/headers/FundingSource' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostedPlanResponse' }
        '400': { description: Invalid request or missing Idempotency-Key. }
        '402': { description: The $0.001 hosted-plan wallet admission lacks funds. }
        '409': { description: Same key with different input, or a non-stale effect is pending. }
        '429': { description: Sponsored planner budget exhausted. }
        '503': { description: Durable storage, billing, or digest verification is unavailable. }
  /api/v1/create/{runId}:
    get:
      summary: Read a run's durable state
      responses:
        '200':
          description: Run envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEnvelope' }
        '404': { description: Unknown run (or another principal's run). }
  /api/v1/create/{runId}/candidates/{slot}:
    post:
      summary: Dispatch one candidate's single gpt-image-2 call
      description: >
        Exactly one dispatch wins; concurrent calls receive 409
        candidate_in_flight and completed candidates replay their stored
        state. Failures (content policy, provider errors) settle as a failed
        candidate in the envelope — never a repeated paid call.


        BUILD screens additionally derive their source images server-side from
        the stored plan, in the fixed order `[approved design, previous
        viewport of this page, footer reference]` (deduped, approved design
        always first) — the prompt names each image by that position. A screen
        whose in-page predecessor has not succeeded is refused with 409
        `dependency_pending`. A screen that draws a footer waits for the footer
        SEED (the first footer-bearing slot in plan order) and is refused with
        409 `footer_reference_pending` while the seed is pending or in flight;
        once the seed has FAILED, later footer screens proceed without a
        footer reference. The seed itself and non-footer screens never wait.


        REGENERATE: sending a NEW Idempotency-Key for a `succeeded` or
        `failed` slot authorizes exactly one further paid attempt with its own
        effect key, ledger row, quota charge, and R2 object; the superseded
        image stays stored until the run's TTL collects it. Sending no key, or
        the key that already owns the row, replays durable state. Regenerating
        one screen never invalidates another.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Run envelope with this candidate resolved.
          headers:
            X-12ui-Funding: { $ref: '#/components/headers/FundingSource' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEnvelope' }
        '409':
          description: >
            Candidate already generating (`{error: 'candidate_in_flight'}`), or
            a branch screen waiting on another screen's image.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      error: { type: string, enum: [candidate_in_flight] }
                      message: { type: string }
                  - $ref: '#/components/schemas/DependencyPendingError'
        '410': { description: Run expired. }
        '402': { description: Free candidate allowance exhausted and prepaid wallet balance is insufficient. }
        '429': { description: Daily image quota or sponsored budget exhausted. }
  /api/v1/create/{runId}/candidates/{slot}/image:
    get:
      summary: Serve a succeeded candidate's PNG to the owning principal
      responses:
        '200':
          description: PNG bytes.
          content:
            image/png: {}
        '404': { description: No stored image for this slot. }
        '410': { description: Run expired. }
  /api/v1/create/{runId}/prototype-labels/{labelKey}:
    post:
      summary: Label one exported screen's prototype interactions
      description: >
        Performs exactly one cheap gpt-5.6-luna structured-output call for one
        screen. The caller supplies every candidate interaction and the valid
        destinations; the response returns every candidate id exactly once
        under the four-way navigate/dropdown/modal/none schema. The labelKey is
        the SHA-256 of the normalized request. Current clients send a
        `prototype-label-attempt:{attemptKey}` Idempotency-Key derived from the
        prototype input digest and durable local attempt number, plus those two
        values in X-12ui-Prototype-* headers. Usable action sets remain keyed by
        labelKey and always replay without another provider call; a settled
        attempt with no usable set does not poison a new attempt or input.
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, pattern: '^crt-[a-f0-9]{40}$' }
        - in: path
          name: labelKey
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            pattern: '^prototype-label(?:-attempt)?:[a-f0-9]{64}$'
        - in: header
          name: X-12ui-Prototype-Input-Digest
          required: false
          description: Required with a prototype-label-attempt identity.
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
        - in: header
          name: X-12ui-Prototype-Attempt
          required: false
          description: Durable local attempt generation; required with a prototype-label-attempt identity.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrototypeLabelRequest' }
      responses:
        '200':
          description: New or replayed durable interaction labels.
          headers:
            X-12ui-Funding: { $ref: '#/components/headers/FundingSource' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrototypeLabelResponse' }
        '400': { description: Invalid request or mismatched Idempotency-Key. }
        '404': { description: Unknown run or another principal's run. }
        '409': { description: Identity conflict or this exact attempt concluded unusably. }
        '410': { description: Run expired. }
        '413': { description: Request exceeds 256 KiB. }
        '429': { description: Sponsored budget exhausted. }
        '502': { description: The one provider call returned no valid action set. }
components:
  headers:
    FundingSource:
      description: >-
        Server-derived funding source for this admitted operation. Never includes
        a balance. `admin` is a 12ui operator's own usage, metered but never
        drawn from the sponsored pool.
      schema: { type: string, enum: [sponsored, wallet, admin] }
  schemas:
    PrototypeDestination:
      type: object
      additionalProperties: false
      required: [id, title, followOn]
      properties:
        id: { type: string, maxLength: 240 }
        title: { type: string, maxLength: 240 }
        followOn: { type: boolean }
    PrototypeCandidate:
      type: object
      additionalProperties: false
      required: [id, kind, text, inSharedChrome]
      properties:
        id: { type: string, maxLength: 240 }
        kind: { type: string, enum: [button, link, nav, row, card, other] }
        text: { type: string, maxLength: 500 }
        inSharedChrome: { type: boolean }
    PrototypeLabelRequest:
      type: object
      additionalProperties: false
      required: [product, screen, destinations, holdingTargets, candidates]
      properties:
        product: { type: string, maxLength: 1200 }
        screen:
          type: object
          additionalProperties: false
          required: [id, title, purpose, content]
          properties:
            id: { type: string, maxLength: 240 }
            title: { type: string, maxLength: 240 }
            purpose: { type: string, maxLength: 1200 }
            content: { type: string, maxLength: 4000 }
        destinations:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/PrototypeDestination' }
        holdingTargets:
          type: array
          maxItems: 200
          items: { type: string, pattern: '^holding:', maxLength: 240 }
        candidates:
          type: array
          minItems: 1
          maxItems: 240
          items: { $ref: '#/components/schemas/PrototypeCandidate' }
    PrototypeAction:
      type: object
      additionalProperties: false
      required: [id, action, target, options, modal]
      properties:
        id: { type: string }
        action: { type: string, enum: [navigate, dropdown, modal, none] }
        target: { type: [string, 'null'] }
        options:
          oneOf:
            - { type: 'null' }
            - type: array
              minItems: 3
              maxItems: 6
              items: { type: string }
        modal:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [title, body, confirm]
              properties:
                title: { type: string }
                body: { type: string }
                confirm: { type: string }
    PrototypeLabelResponse:
      type: object
      additionalProperties: false
      required: [actions, model, providerRequestId, costMicros, replayed]
      properties:
        actions:
          type: array
          items: { $ref: '#/components/schemas/PrototypeAction' }
        model: { type: string, enum: [gpt-5.6-luna] }
        providerRequestId: { type: [string, 'null'] }
        costMicros: { type: integer, minimum: 0 }
        replayed: { type: boolean }
    ReferenceImage:
      type: object
      additionalProperties: false
      required: [data, mediaType, sha256]
      properties:
        data: { type: string, description: Base64 image, 6MB decoded max. }
        mediaType: { type: string, enum: [image/png, image/jpeg, image/webp] }
        sha256: { type: string }
    RetainLabel:
      type: string
      minLength: 1
      maxLength: 64
      description: >
        Semantic retain dimension. The primary vocabulary is style, layout,
        content, and assets. Bounded unknown labels are accepted and preserved;
        obvious representation aliases such as colours to palette, fonts to
        typography, and structure to layout normalize deterministically.
    RetainInput:
      description: >
        Permissive semantic intent normalized before hashing and storage. A
        string is one included label; an array is an included label set; the
        object form accepts string or array include/exclude values plus bounded
        notes. Values are trimmed, case-folded, aliased, deduplicated, and
        sorted. Explicit exclusions win contradictions. A referenced new-page
        request with no retain field defaults to style included and layout,
        content, and assets excluded. Included layout maps to
        preserve-structure and requires every candidate to use the uploaded
        referenceImage. Other retain intent requires at least one candidate
        reference.
      oneOf:
        - $ref: '#/components/schemas/RetainLabel'
        - type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/RetainLabel' }
        - type: object
          additionalProperties: false
          properties:
            include:
              oneOf:
                - $ref: '#/components/schemas/RetainLabel'
                - type: array
                  maxItems: 16
                  items: { $ref: '#/components/schemas/RetainLabel' }
            exclude:
              oneOf:
                - $ref: '#/components/schemas/RetainLabel'
                - type: array
                  maxItems: 16
                  items: { $ref: '#/components/schemas/RetainLabel' }
            notes: { type: string, minLength: 1, maxLength: 600 }
    RetainPolicy:
      type: object
      additionalProperties: false
      required: [include, exclude]
      description: Canonical retain intent returned from durable run truth.
      properties:
        include:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/RetainLabel' }
        exclude:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/RetainLabel' }
        notes: { type: string, minLength: 1, maxLength: 600 }
    HostedPlanCapture:
      type: object
      additionalProperties: false
      required: [sha256, width, height]
      properties:
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        width: { type: integer, minimum: 1, maximum: 100000 }
        height: { type: integer, minimum: 1, maximum: 100000 }
    HostedPlanRequest:
      type: object
      additionalProperties: false
      required: [direction, referenceImageAttached]
      properties:
        direction: { type: string, minLength: 1, maxLength: 1200 }
        capture: { $ref: '#/components/schemas/HostedPlanCapture' }
        referenceImageAttached: { type: boolean }
    HostedPlanResponse:
      type: object
      additionalProperties: false
      required: [concept, retain, corpusQuery, effectIdentity, replayed]
      properties:
        concept: { type: string }
        retain: { $ref: '#/components/schemas/RetainPolicy' }
        corpusQuery: { type: string }
        effectIdentity: { type: string, pattern: '^hosted-plan:[a-f0-9]{64}$' }
        replayed: { type: boolean }
        degradation:
          type: object
          additionalProperties: false
          required: [reasons]
          properties:
            reasons:
              type: array
              minItems: 1
              items: { type: string }
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [concept, candidates]
      properties:
        concept: { type: string, maxLength: 1200 }
        aspect:
          type: string
          enum: [landscape, portrait, square]
          default: landscape
        mode:
          type: string
          enum: [inspiration, preserve-structure]
          default: inspiration
        retain: { $ref: '#/components/schemas/RetainInput' }
        candidates:
          type: array
          minItems: 1
          maxItems: 96
          items:
            type: object
            additionalProperties: false
            required: [slot]
            properties:
              slot:
                type: string
                pattern: '^(?:[a-z]|[ab][a-z]|c[a-r])$'
                description: Stable slot from a through cr.
              referenceId:
                type: string
                description: Corpus reference conditioning this candidate.
              useReferenceImage:
                type: boolean
                description: Condition on the run's uploaded referenceImage.
              direction:
                type: string
                maxLength: 120
                description: >
                  The candidate's single desired quality. Omitted directions
                  are derived server-side by one metered text call over the
                  references' authored metadata.
        referenceImage: { $ref: '#/components/schemas/ReferenceImage' }
    BuildRunRequest:
      type: object
      additionalProperties: false
      required: [source, concept]
      description: Exactly one of `winner` or `referenceImage` must be present.
      properties:
        source: { type: string, enum: [build] }
        concept: { type: string, maxLength: 1200 }
        aspect:
          type: string
          enum: [landscape, portrait, square]
          description: >
            Explicitly declares this canvas for every generated slot. When
            omitted, each slot inherits the approved winner's declared canvas.
        maxScreens:
          type: integer
          minimum: 1
          maximum: 8
          description: >
            Total screens this branch may plan across the source
            continuations and the further pages. Asked of the director and
            enforced deterministically on parse, so every planned page keeps
            at least one screen. Omitted means the eight-slot ceiling. Not
            part of the run's identity: the same Idempotency-Key replays with
            or without it.
        winner:
          type: object
          additionalProperties: false
          required: [createRunId, slot]
          properties:
            createRunId: { type: string, pattern: '^crt-[a-f0-9]{40}$' }
            slot: { type: string, enum: [a, b, c, d, e, f, g, h] }
        referenceImage: { $ref: '#/components/schemas/ReferenceImage' }
    BranchPlan:
      type: object
      description: Present on build runs only. Absent on create runs.
      required: [sitePurpose, statusUpdate, approvedScreenSummary, pages]
      properties:
        sitePurpose:
          type: string
          description: The core visitor or user value in one short sentence.
        statusUpdate:
          type: string
          description: >
            One or two first-person sentences for the user explaining what
            this branch builds. Safe to render verbatim.
        approvedScreenSummary:
          type: string
          description: What the approved design already says (context to subtract).
        winnerCanvas:
          type: object
          description: >
            Native declared dimensions of the approved winner. Present on new
            build runs; absent on legacy records.
          required: [width, height]
          properties:
            width: { type: integer, minimum: 1 }
            height: { type: integer, minimum: 1 }
        pages:
          type: array
          items:
            type: object
            required: [index, kind, title, pageType, surfaceType, purpose, slots]
            properties:
              index:
                type: integer
                description: >
                  Plan position. 0 is always the source page, present even
                  when the approved screen already ends — then it carries
                  `slots: []` and `sourceEndsHere: true`. Runs planned before
                  2026-08-18 may start at index 1.
              kind: { type: string, enum: [source, additional] }
              title: { type: string }
              pageType:
                type: string
                enum: [marketing, explanatory, directory, editorial, application, documentation, other]
              surfaceType:
                type: string
                enum: [web_page, web_app, mobile_app, immersive]
              purpose: { type: string }
              sourceEndsHere:
                type: boolean
                description: Source page only.
              slots:
                type: array
                description: This page's slots, in viewport order.
                items: { type: string, enum: [a, b, c, d, e, f, g, h] }
    Candidate:
      type: object
      required: [slot, status, direction, reference, width, height]
      properties:
        slot: { type: string, enum: [a, b, c, d, e, f, g, h] }
        status: { type: string, enum: [pending, dispatched, succeeded, failed] }
        direction:
          type: string
          description: >
            Create runs: the candidate's desired quality. Build runs: the page
            title, suffixed `(part N)` for later viewports of the same page.
        reference:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [corpus, upload, artifact, none] }
            referenceId: { type: string }
        width: { type: integer }
        height: { type: integer }
        image:
          type: string
          description: Present when status is `succeeded`.
        error:
          type: object
          description: Present when status is `failed`.
          properties:
            code: { type: string }
            message: { type: string }
        pageIndex:
          type: integer
          description: Build screens only. Matches a `plan.pages[].index`.
        viewportOrdinal:
          type: integer
          description: >
            Build screens only. 1-based within an additional page; source
            continuations begin at 2 because the approved design is screen 1.
        header:
          type: [boolean, 'null']
          description: >
            Build screens only. Derived: true on the first viewport of an
            additional web_page; null on non-webpage surfaces.
        footer:
          type: [boolean, 'null']
          description: >
            Build screens only. Derived: true on the last viewport of a
            web_page; null on non-webpage surfaces.
        pageEndsHere:
          type: boolean
          description: Build screens only. True on each page's last screen.
        dependsOnSlot:
          type: [string, 'null']
          description: >
            Build screens only. The previous viewport of the same page, which
            must succeed before this slot can be dispatched.
        content:
          type: string
          description: Build screens only. The plan's semantic direction for this screen.
        canvasDecision:
          type: object
          description: >
            Build screens only. Records whether request geometry inherited the
            approved winner or came from an explicit declaration for this slot.
          required: [provenance, sourceCanvas]
          properties:
            provenance:
              type: string
              enum: [inherited-from-winner, slot-declared]
            sourceCanvas:
              type: object
              required: [width, height]
              properties:
                width: { type: integer, minimum: 1 }
                height: { type: integer, minimum: 1 }
    RunEnvelope:
      type: object
      required: [id, concept, aspect, mode, retain, source, createdAt, expiresAt, candidates]
      properties:
        id: { type: string, pattern: '^crt-[a-f0-9]{40}$' }
        concept: { type: string }
        aspect: { type: string, enum: [landscape, portrait, square] }
        mode: { type: string, enum: [inspiration, preserve-structure] }
        retain:
          oneOf:
            - { type: 'null' }
            - $ref: '#/components/schemas/RetainPolicy'
        source: { type: string, enum: [create, build] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        plan: { $ref: '#/components/schemas/BranchPlan' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
    DependencyPendingError:
      type: object
      required: [error]
      description: >
        A branch screen refused because another screen's image is not ready.
        `error` is an OBJECT here, unlike every other create error where it is
        a string code; `message` is also mirrored at the top level.
      properties:
        error:
          type: object
          required: [code, dependsOn, message]
          properties:
            code:
              type: string
              enum: [dependency_pending, footer_reference_pending]
            dependsOn:
              type: string
              description: The slot to dispatch first.
              enum: [a, b, c, d, e, f, g, h]
            message: { type: string }
        message: { type: string }
